[package]
name = "jig"
version = "0.1.0"
edition = "2024"
description = "Scaffolds, checks and renders engineering projects that follow the bench engineering process"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
jiff = "0.2"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
walkdir = "2"
wavedrom = "0.1"

[dev-dependencies]
assert_cmd = "2"
